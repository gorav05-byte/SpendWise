<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Budgets - SpendWise</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <script src="/js/common.js"></script>
</head>
<body data-page="budgets" data-title="Budgets" data-protected="true">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="page-head">
          <div>
            <h2>Budgets</h2>
            <p class="muted">Set monthly limits and watch your spending against them.</p>
          </div>
          <button class="btn btn-primary" id="btn-add" type="button">+ Set Budget</button>
        </div>

        <section class="card">
          <div class="period-row">
            <div class="field"><label for="period-month">Month</label><select id="period-month"></select></div>
            <div class="field"><label for="period-year">Year</label><select id="period-year"></select></div>
          </div>
        </section>

        <div id="alerts"></div>
        <div class="budget-list" id="budget-list"></div>
      </main>
    </div>
  </div>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <form id="form" novalidate>
        <div class="modal-header"><h3 id="modal-title">Set Budget</h3><button type="button" class="icon-btn" id="btn-close" aria-label="Close">&times;</button></div>
        <div class="modal-body">
          <div class="form-error" hidden></div>
          <div class="form-grid">
            <div class="field full"><label for="f-category">Budget for</label><select id="f-category" name="category"></select><small class="field-error" data-error-for="category"></small></div>
            <div class="field full"><label for="f-amount">Budget amount</label><input type="number" id="f-amount" name="amount" min="0.01" step="0.01" placeholder="0.00"><small class="field-error" data-error-for="amount"></small></div>
            <div class="field"><label for="f-month">Month</label><select id="f-month" name="month"></select><small class="field-error" data-error-for="month"></small></div>
            <div class="field"><label for="f-year">Year</label><select id="f-year" name="year"></select><small class="field-error" data-error-for="year"></small></div>
          </div>
        </div>
        <div class="modal-footer"><button type="button" class="btn btn-ghost" id="btn-cancel">Cancel</button><button type="submit" class="btn btn-primary" id="btn-save">Save budget</button></div>
      </form>
    </div>
  </div>

  <script src="/js/budgets.js"></script>
</body>
</html>
